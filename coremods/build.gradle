plugins {
    id 'java-library'
    id 'idea'
}

version = rootProject.version

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net' }
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

dependencies {
    compileOnly "net.neoforged.fancymodloader:loader:10.0.37"

    testImplementation "net.neoforged.fancymodloader:loader:10.0.37"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.2'
}

test {
    useJUnitPlatform()
}

base {
    archivesName = "libx-coremods"
}

jar {
    manifest {
        attributes(
                'FMLModType': "LIBRARY",
                'Specification-Title': "libx-coremods",
                'Specification-Vendor': "libx"
        )
    }
}
